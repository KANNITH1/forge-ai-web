<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <main class="container">
    <header class="hero">
      <span class="eyebrow">AI IMAGE ENGINE</span>
      <h1>Forge <span class="grad-text">AI</span></h1>
      <p class="subtitle">พิมพ์สิ่งที่คุณจินตนาการ แล้วปล่อยให้ AI หลอมมันขึ้นมาเป็นภาพ</p>
    </header>

    <section class="panel">
      <form id="generate-form">
        <label for="prompt">Prompt</label>
        <textarea
          id="prompt"
          name="prompt"
          rows="3"
          placeholder="เช่น a lone astronaut walking on a neon city street, cinematic lighting"
          required
        ></textarea>
        <button type="submit" id="submit-btn">
          <span class="btn-text">สร้างภาพ</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <p id="status"></p>

      <div id="result">
        <img id="result-image" src="" alt="ผลลัพธ์ภาพ AI">
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
